<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Informes de Rendimentos → Excel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
  :root { --c:#1f4e79; }
  * { box-sizing:border-box; }
  body { font-family: Segoe UI, Arial, sans-serif; background:#f5f7fa; margin:0; color:#222; }
  header { background:var(--c); color:#fff; padding:18px 28px; }
  header h1 { margin:0; font-size:20px; }
  header p { margin:4px 0 0; font-size:13px; opacity:.85; }
  main { max-width:1300px; margin:24px auto; padding:0 20px; }
  #drop { border:2px dashed var(--c); border-radius:10px; background:#fff; padding:36px; text-align:center; cursor:pointer; }
  #drop.over { background:#e8f0f8; }
  #drop.busy { opacity:.6; pointer-events:none; }
  #drop b { color:var(--c); }
  .bar { display:flex; gap:10px; align-items:center; margin:18px 0; flex-wrap:wrap; }
  button { background:var(--c); color:#fff; border:0; border-radius:6px; padding:10px 18px; font-size:14px; cursor:pointer; }
  button.sec { background:#fff; color:var(--c); border:1px solid var(--c); }
  button:disabled { opacity:.4; cursor:default; }
  #status { font-size:13px; color:#555; }
  .wrap { background:#fff; border-radius:8px; overflow:auto; max-height:62vh; border:1px solid #ddd; }
  table { border-collapse:collapse; font-size:12px; width:100%; }
  th, td { border:1px solid #e3e3e3; padding:4px 8px; white-space:nowrap; }
  th { background:#eef2f7; position:sticky; top:0; }
  td.n { text-align:right; }
  tr.warn td { background:#fff6cc; }
</style>
</head>
<body>
<header>
  <h1>Informes de Rendimentos → Excel</h1>
  <p>Roda no seu computador: os PDFs não são enviados para nenhum lugar. Modelos prontos: Bradesco e Banco do Brasil.</p>
</header>
<main>
  <div id="drop">
    <input type="file" id="file" accept="application/pdf" multiple hidden>
    <p><b>Arraste os PDFs aqui</b> ou clique para escolher</p>
    <p style="font-size:12px;color:#777">Pode enviar vários de uma vez. PDFs em imagem levam ~20s por página.</p>
  </div>
  <div class="bar">
    <button id="btnExcel" disabled>Baixar Excel</button>
    <button id="btnClear" class="sec" disabled>Limpar</button>
    <span id="status"></span>
  </div>
  <div class="wrap"><table id="tbl"></table></div>
</main>
<script>
// ===== PARSER (início) =====
const VAL = "-?\\d{1,3}(?:\\.\\d{3})*,\\d{2}";
const MESES = ["janeiro","fevereiro","marco","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];

function num(s) { return parseFloat(s.replace(/\./g, "").replace(",", ".")); }
function semAcento(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function fmtCnpj(s) {
  let d = (s || "").replace(/\D/g, "");
  if (d.length === 15 && d[0] === "0") d = d.slice(1);
  if (d.length !== 14) return s || "";
  return d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, "$1.$2.$3/$4-$5");
}
function ehTitulo(l) {
  const t = l.trim();
  return t.length >= 4 && /^[A-Z0-9 ()\-\/.&]+$/.test(t) && /[A-Z]{3}/.test(t) &&
    !/^(TOTAL|AG\/CONTA|SALDO|CODIGO|\*)/.test(t);
}
// Mês do Bradesco vem com erros de OCR (07 → "97", "o8", "as"...). Corrige e garante ordem.
function corrigirMes(tok, anterior) {
  const mapa = { o:"0",O:"0",D:"0",Q:"0",a:"0",e:"0",s:"8",S:"8",B:"8",$:"8",g:"9",q:"9",l:"1",I:"1",i:"1","|":"1",z:"2",Z:"2" };
  const c = tok.replace(/[^0-9A-Za-z$|]/g, "").slice(0, 2).split("").map(x => mapa[x] || x).join("");
  let m = null, ok = false;
  if (/^\d\d$/.test(c)) {
    const d1 = c[0] === "1" && /[0-2]/.test(c[1]) ? "1" : "0";
    m = parseInt(d1 + c[1], 10);
    ok = c === (d1 + c[1]);
  }
  if (!m || m < 1 || m > 12 || (anterior && m <= anterior)) { m = anterior ? anterior + 1 : null; ok = false; }
  return { m, ok };
}

// Confere a soma dos meses com o TOTAL do PDF. Se só um valor diverge em 1 algarismo, corrige.
function conferirBloco(bloco, totRend, totIr) {
  for (const [campo, tot] of [["rend", totRend], ["ir", totIr]]) {
    const soma = bloco.reduce((a, r) => a + r[campo], 0);
    if (Math.abs(soma - tot) < 0.005) continue;
    const cand = bloco.filter(r => {
      const novo = Math.round((tot - (soma - r[campo])) * 100) / 100;
      const a = r[campo].toFixed(2), b = novo.toFixed(2);
      return novo >= 0 && a.length === b.length && [...a].filter((c, i) => c !== b[i]).length === 1;
    });
    if (cand.length === 1) {
      const r = cand[0];
      r[campo] = Math.round((tot - (soma - r[campo])) * 100) / 100;
      marcar(r, "Valor corrigido pelo TOTAL do PDF");
    } else bloco.forEach(r => marcar(r, "Soma dos meses ≠ TOTAL do PDF"));
  }
}
function marcar(r, msg) { if (!(r.conferir || "").includes(msg)) r.conferir = (r.conferir ? r.conferir + "; " : "") + msg; }

function detectarBanco(texto) {
  if (/bradesco/i.test(texto)) return "Bradesco";
  if (/CIB ULTRA|Ouvidoria BB|banco do brasil|irpj, imposto de renda/i.test(texto)) return "Banco do Brasil";
  if (/ita[uú]/i.test(texto)) return "Itaú";
  if (/santander/i.test(texto)) return "Santander";
  return "Não identificado";
}

function extrair(linhasTxt, arquivo) {
  // junta números que o OCR separou ("33.474 .802,70")
  linhasTxt = linhasTxt.map(l => l.replace(/(\d)\s+([.,]\d)/g, "$1$2").replace(/(\d[.,])\s+(\d)/g, "$1$2"));
  const texto = linhasTxt.join("\n");
  const banco = detectarBanco(texto);
  const ano = (texto.match(/Ano-Calend[aá]rio\s+(\d{4})/i) || texto.match(/\d{2}\/\d{2}\/(\d{4})/) || [])[1] || "";
  if (banco === "Bradesco") return bradesco(linhasTxt, arquivo, ano);
  if (banco === "Banco do Brasil") return bb(linhasTxt, arquivo, ano);
  return linhasTxt.filter(l => l.trim()).map(l => ({ arquivo, banco, produto: l.trim(), conferir: "Banco ainda sem modelo – texto bruto" }));
}

function base(arquivo, banco) { return { arquivo, banco, fonte: "", cnpjFonte: "", benef: "", cnpjBenef: "" }; }

function bradesco(L, arquivo, ano) {
  const cab = base(arquivo, "Bradesco");
  const out = [];
  let produto = "", codRet = "", ultimoTitulo = "", saldoPend = null, conta = "", mesAnt = 0, bloco = [], deposito = null;
  const fecharBloco = (rend, ir) => { conferirBloco(bloco, rend, ir); bloco = []; mesAnt = 0; };
  for (let i = 0; i < L.length; i++) {
    const l = L[i].trim(); let m;
    if (!l) continue;
    if ((m = l.match(/^(BANCO BRADESCO S\.?A\.?)\s+([\d.\/\- ]{14,})$/i))) { cab.fonte = "BANCO BRADESCO S.A."; cab.cnpjFonte = "60.746.948/0001-12"; continue; }
    if (/^Raz[aã]o Social/i.test(l)) {
      const nx = (L.slice(i + 1).find(x => x.trim()) || "").trim();
      if ((m = nx.match(/^(.+?)\s+(\d{2,3}\.\d{3}\.\d{3}\/\d{4}-\d{2})/))) { cab.benef = m[1].replace(/\.{2,}$/, "."); cab.cnpjBenef = fmtCnpj(m[2]); }
      continue;
    }
    if ((m = l.match(/CODIGO DE RETEN[CÇ][AÃ]O:?\s*(\d+)/i))) { produto = ultimoTitulo; codRet = m[1]; deposito = null; continue; }
    if (/^DEPOSITO BANCARIO/i.test(l)) { produto = l; codRet = ""; deposito = ""; continue; }
    if ((m = l.match(new RegExp("SALDO ORIGINAL APLICADO EM\\s+(\\d{2}\\/\\d{2}\\/\\d{4})\\s+(" + VAL + ")")))) {
      saldoPend = { data: m[1], valor: num(m[2]), suspeito: /^[1-9],00$/.test(m[2]) }; continue;
    }
    if ((m = l.match(/^AG\/CONTA\s+SALDO EM\s+(\d{2}\/\d{2}\/\d{4})/i))) { deposito = m[1]; continue; }
    if (deposito !== null && (m = l.match(new RegExp("^(\\d{4}\\/\\d{7}-\\d)\\s+(" + VAL + ")$")))) {
      out.push({ ...cab, produto, codRet, conta: m[1], saldoData: deposito, saldo: num(m[2]) }); continue;
    }
    if ((m = l.match(new RegExp("^TOTAL\\s+(" + VAL + ")\\s+(" + VAL + ")$")))) { fecharBloco(num(m[1]), num(m[2])); continue; }
    if (/^TOTAL/i.test(l)) continue;
    let linhaMes = null;
    if ((m = l.match(new RegExp("^(\\d{4}\\/\\d{7}-\\d)\\D{0,3}?\\s+(\\S{1,5})\\s+(" + VAL + ")\\s+(" + VAL + ")$")))) { conta = m[1]; mesAnt = 0; linhaMes = [m[2], m[3], m[4]]; }
    else if (conta && (m = l.match(new RegExp("^(\\S{1,5})\\s+(" + VAL + ")\\s+(" + VAL + ")$")))) linhaMes = [m[1], m[2], m[3]];
    if (linhaMes) {
      const semMes = /^\?+$/.test(linhaMes[0]) && num(linhaMes[1]) === 0 && num(linhaMes[2]) === 0;
      const cm = semMes ? { m: null, ok: true } : corrigirMes(linhaMes[0], mesAnt); mesAnt = cm.m || mesAnt;
      const r = { ...cab, produto, codRet, conta, mes: cm.m ? String(cm.m).padStart(2, "0") + "/" + ano : "",
                  rend: num(linhaMes[1]), ir: num(linhaMes[2]), conferir: cm.ok ? "" : "Mês deduzido (leitura imprecisa)" };
      if (saldoPend) {
        r.saldoData = saldoPend.data; r.saldo = saldoPend.valor;
        if (saldoPend.suspeito) r.conferir = (r.conferir ? r.conferir + "; " : "") + "Saldo pode ser 0,00";
        saldoPend = null;
      }
      out.push(r); bloco.push(r); continue;
    }
    if (ehTitulo(l) && !/VALORES EM REAIS|ATENDIMENTO|OUVIDORIA|DEFICIENTE|SAC/.test(l)) ultimoTitulo = l;
  }
  return out;
}

function bb(L, arquivo, ano) {
  const cab = { ...base(arquivo, "Banco do Brasil"), fonte: "BANCO DO BRASIL S.A." };
  const out = []; let produto = "", ultimoTitulo = "", conta = "", sec = 0, bloco = [];
  for (const raw of L) {
    const l = raw.trim(); let m;
    if (!l) continue;
    if (/^1\s*\.?\s*Identifica/i.test(l)) { sec = 1; continue; }
    if (/^2\s*\.?\s*Pessoa/i.test(l)) { sec = 2; continue; }
    if (/^3\s*\.?\s*Especifica/i.test(l)) { sec = 3; continue; }
    if (sec === 1 && (m = l.match(/Ag[eê]ncia\W*([\d\-xX]+).*CNPJ\W*([\d.\/\-]+)/i))) { cab.fonte += " – Ag. " + m[1]; cab.cnpjFonte = fmtCnpj(m[2]); continue; }
    if (sec === 2 && (m = l.match(/(\d{3,8}-[\dxX])\s+(.+?)\s+CNPJ\W*([\d.\/\-]+)/i))) { conta = m[1]; cab.benef = m[2]; cab.cnpjBenef = fmtCnpj(m[3]); continue; }
    if (sec < 3) continue;
    if (/^Rendimento Tributad/i.test(l)) { produto = ultimoTitulo; bloco = []; continue; }
    if ((m = l.match(new RegExp("^TOTAL\\W*(" + VAL + ")\\s+TOTAL\\W*(" + VAL + ")")))) {
      conferirBloco(bloco, num(m[1]), num(m[2]));
      bloco = []; continue;
    }
    if ((m = semAcento(l).match(new RegExp("^([A-Za-z]+)\\W*(" + VAL + ")\\s+[A-Za-z]+\\W*(" + VAL + ")")))) {
      const idx = MESES.indexOf(m[1].toLowerCase());
      if (idx >= 0) {
        const r = { ...cab, produto, codRet: "", conta, mes: String(idx + 1).padStart(2, "0") + "/" + ano, rend: num(m[2]), ir: num(m[3]), conferir: "" };
        out.push(r); bloco.push(r); continue;
      }
    }
    if (ehTitulo(l) && !/^TOTAL/.test(l)) ultimoTitulo = l;
  }
  return out;
}
// ===== PARSER (fim) =====

// ===== LEITURA DO PDF (início) =====
// Lê um PDF e devolve as linhas de texto. Usa o texto do PDF quando existe; senão faz OCR.
// env = { pdfjsLib, Tesseract, novoCanvas(w,h), log(msg), senha(msg) }
const ESCALA_OCR = 300 / 72;
let _workers = null;

async function workersOCR(env) {
  if (_workers) return _workers;
  env.log("Preparando leitura de imagem (só na primeira vez)…");
  const opts = env.tessOpts || {};
  const texto = await env.Tesseract.createWorker("por", 1, opts);
  await texto.setParameters({ tessedit_pageseg_mode: "4" });
  const digitos = await env.Tesseract.createWorker("por", 1, opts);
  await digitos.setParameters({ tessedit_pageseg_mode: "10", tessedit_char_whitelist: "0123456789" });
  _workers = { texto, digitos };
  return _workers;
}

async function lerLinhasPdf(buf, nome, env) {
  const task = env.pdfjsLib.getDocument({ data: buf });
  task.onPassword = (update, reason) => {
    const s = env.senha(reason === 2 ? "Senha incorreta para " + nome + ". Tente de novo:" : nome + " tem senha. Digite a senha:");
    if (s === null) { task.destroy(); return; }
    update(s);
  };
  const pdf = await task.promise;
  const linhas = [];
  let usouOcr = false;
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const itens = tc.items.filter(i => i.str && i.str.trim());
    if (itens.map(i => i.str).join("").length > 80) {
      linhas.push(...linhasDoTexto(itens));
    } else {
      usouOcr = true;
      env.log(nome + ": lendo página " + p + " de " + pdf.numPages + " (imagem)…");
      linhas.push(...await ocrPagina(page, env));
    }
  }
  return { linhas, usouOcr };
}

function linhasDoTexto(items) {
  const it = items.map(i => ({ s: i.str, x: i.transform[4], y: i.transform[5], w: i.width, h: Math.abs(i.transform[3]) || 8 }));
  it.sort((a, b) => b.y - a.y || a.x - b.x);
  const rows = [];
  for (const i of it) {
    const r = rows.find(r => Math.abs(r.y - i.y) <= Math.max(2, i.h * 0.4));
    if (r) r.it.push(i); else rows.push({ y: i.y, it: [i] });
  }
  rows.sort((a, b) => b.y - a.y);
  return rows.map(r => r.it.sort((a, b) => a.x - b.x).map(i => i.s.trim()).join(" ").replace(/\s+/g, " "));
}

async function ocrPagina(page, env) {
  const vp = page.getViewport({ scale: ESCALA_OCR });
  const cv = env.novoCanvas(Math.ceil(vp.width), Math.ceil(vp.height));
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  const W = await workersOCR(env);
  const { data } = await W.texto.recognize(env.imagem ? env.imagem(cv) : cv);
  const VALRE = /^-?\d{1,3}(?:\.\d{3})*,\d{2}$/;
  const mesBox = (data.words.find(w => w.text.trim() === "MES") || {}).bbox;
  const recorte = async (x0, y0, x1, y1, lista, psm = "10") => {
    x0 = Math.max(0, Math.floor(x0)); y0 = Math.max(0, Math.floor(y0));
    const w = Math.min(cv.width - x0, Math.ceil(x1 - x0)), h = Math.min(cv.height - y0, Math.ceil(y1 - y0));
    const c2 = env.novoCanvas(w * 2, h * 2), g = c2.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, c2.width, c2.height);
    g.drawImage(cv, x0, y0, w, h, 0, 0, w * 2, h * 2);
    await W.digitos.setParameters({ tessedit_char_whitelist: lista, tessedit_pageseg_mode: psm });
    const r = await W.digitos.recognize(env.imagem ? env.imagem(c2) : c2);
    return lista.includes(",") ? (r.data.text || "").replace(/\s/g, "") : (r.data.text || "").replace(/\D/g, "");
  };
  // acha as colunas de pixels escuros (cada algarismo) numa faixa da imagem
  const ctxP = cv.getContext("2d");
  const glifos = (x0, y0, x1, y1) => {
    x0 = Math.max(0, x0); y0 = Math.max(0, y0);
    const w = x1 - x0, h = y1 - y0, px = ctxP.getImageData(x0, y0, w, h).data, grupos = [];
    let ini = -1;
    for (let x = 0; x <= w; x++) {
      let escuro = false;
      if (x < w) for (let y = 0; y < h; y++) { if (px[(y * w + x) * 4] < 140) { escuro = true; break; } }
      if (escuro && ini < 0) ini = x;
      if (!escuro && ini >= 0) { grupos.push([x0 + ini, x0 + x]); ini = -1; }
    }
    return grupos.filter(g => g[1] - g[0] >= 3);
  };
  // separa algarismos encostados: divide grupos largos pela largura de um caractere
  const separar = (grupos, cw) => grupos.flatMap(([a, b]) => {
    const k = Math.max(1, Math.round((b - a) / cw));
    return Array.from({ length: k }, (_, i) => [a + (b - a) * i / k, a + (b - a) * (i + 1) / k]);
  });
  // Valores: o OCR às vezes perde o "1" inicial (fonte fina). Se há tinta logo à esquerda, relê o valor.
  const escuroEm = (x0, y0, x1, y1) => {
    x0 = Math.max(0, Math.floor(x0)); y0 = Math.max(0, Math.floor(y0));
    const w = Math.ceil(x1 - x0), h = Math.ceil(y1 - y0);
    if (w <= 0 || h <= 0) return false;
    const px = ctxP.getImageData(x0, y0, w, h).data;
    for (let i = 0; i < px.length; i += 4) if (px[i] < 120) return true;
    return false;
  };
  for (const ln of data.lines) for (let k = 0; k < ln.words.length; k++) {
    const w = ln.words[k], t = w.text.trim();
    if (!/\d,\d\d$/.test(t)) continue;
    const ant = ln.words[k - 1];
    if (/^[.,]/.test(t) && ant && /\d$/.test(ant.text.trim()) && w.bbox.x0 - ant.bbox.x1 < (w.bbox.x1 - w.bbox.x0) / t.length * 1.5) continue; // número partido em dois pedaços
    const b = w.bbox, cw = (b.x1 - b.x0) / Math.max(1, t.length), h = b.y1 - b.y0;
    const valido = /^-?\d{1,3}(?:\.\d{3})*,\d{2}$/.test(t);
    if (valido && !escuroEm(b.x0 - cw * 0.8, b.y0 + h * 0.15, b.x0 - 3, b.y1 - h * 0.15)) continue;
    const novo = await recorte(b.x0 - cw * 1.6, b.y0 - 12, b.x1 + 12, b.y1 + 12, "0123456789.,", "7");
    const digs = x => x.replace(/\D/g, "");
    if (/^-?\d{1,3}(?:\.\d{3})*,\d{2}$/.test(novo) && digs(novo).endsWith(digs(t)) && digs(novo).length <= digs(t).length + 1) w.text = novo;
  }
  const out = [];
  for (const ln of data.lines) {
    let ws = ln.words.filter(w => w.text.trim());
    const n = ws.length, txt = ws.map(w => w.text);
    const linhaValores = n >= 2 && VALRE.test(txt[n - 1]) && VALRE.test(txt[n - 2]) && !txt.some(t => /^TOTAL/i.test(t));
    if (linhaValores && mesBox) {
      // Coluna "MES" (Bradesco): lê cada algarismo separado, só com dígitos (o OCR erra o zero cortado)
      const gw = (mesBox.x1 - mesBox.x0) / 3, pad = 15;
      const y0 = ws[n - 2].bbox.y0 - pad, y1 = ws[n - 2].bbox.y1 + pad;
      const gl = separar(glifos(Math.floor(mesBox.x0 - gw), Math.floor(ws[n - 2].bbox.y0), Math.ceil(mesBox.x1 + gw), Math.ceil(ws[n - 2].bbox.y1)), gw * 1.08);
      let d1 = "", d2 = "";
      if (gl.length) {
        const u = gl[gl.length - 1];
        d2 = await recorte(u[0] - 4, y0, u[1] + pad, y1, "0123456789");
        if (gl.length >= 2) d1 = await recorte(gl[gl.length - 2][0] - pad, y0, gl[gl.length - 2][1] + 4, y1, "0123456789");
      }
      const antes = ws.slice(0, n - 2).filter(w => w.bbox.x1 < mesBox.x0 - 5).map(w => w.text);
      const mes = d2 ? ((d1 === "1" && /[0-2]/.test(d2[0]) ? "1" : "0") + d2[0]) : "??";
      out.push([...antes, mes, txt[n - 2], txt[n - 1]].join(" "));
      continue;
    }
    if (linhaValores && n >= 3 && txt[n - 3].length <= 5) {
      const b = ws[n - 3].bbox, pad = 15;
      const d = await recorte(b.x0 + (b.x1 - b.x0) / 2, b.y0 - pad, b.x1 + pad, b.y1 + pad, "0123456789");
      if (d) txt[n - 3] = "0" + d[d.length - 1];
    }
    out.push(txt.join(" "));
  }
  return out;
}
// ===== LEITURA DO PDF (fim) =====


const COLS = [
  ["Arquivo","arquivo",28],["Banco","banco",14],["Fonte Pagadora","fonte",26],["CNPJ Fonte","cnpjFonte",19],
  ["Beneficiário","benef",26],["CNPJ Beneficiário","cnpjBenef",19],["Produto","produto",40],["Cód. Retenção","codRet",10],
  ["Ag/Conta","conta",16],["Mês","mes",9],["Rendimento Tributável","rend",18],["IR na Fonte","ir",16],
  ["Saldo em","saldoData",11],["Saldo","saldo",18],["Conferir","conferir",34]];
const NUMS = ["rend","ir","saldo"];
let dados = [];
const $ = id => document.getElementById(id);
const env = {
  pdfjsLib, Tesseract,
  novoCanvas: (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; },
  log: m => $("status").textContent = m,
  senha: m => prompt(m)
};
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const drop = $("drop"), inp = $("file");
drop.onclick = () => inp.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); processar(e.dataTransfer.files); };
inp.onchange = () => { processar([...inp.files]); inp.value = ""; };
$("btnClear").onclick = () => { dados = []; render(); $("status").textContent = ""; };
$("btnExcel").onclick = exportar;

let ocupado = false;
async function processar(files) {
  if (ocupado) return; ocupado = true; drop.classList.add("busy");
  for (const f of files) {
    if (!/\.pdf$/i.test(f.name)) continue;
    env.log("Lendo " + f.name + "…");
    try {
      const { linhas } = await lerLinhasPdf(await f.arrayBuffer(), f.name, env);
      const r = extrair(linhas, f.name);
      if (!r.length) alert(f.name + ": não encontrei dados de rendimento.");
      dados.push(...r);
      render();
    } catch (err) { alert("Não consegui ler " + f.name + ":\n" + (err.message || err)); }
  }
  const n = dados.filter(d => d.conferir).length;
  env.log(dados.length + " linhas" + (n ? " · " + n + " para conferir (em amarelo)" : " · tudo bateu com os totais do PDF"));
  ocupado = false; drop.classList.remove("busy");
}

const brl = v => v.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function render() {
  $("btnExcel").disabled = $("btnClear").disabled = !dados.length;
  const t = $("tbl");
  if (!dados.length) { t.innerHTML = ""; return; }
  const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  t.innerHTML = "<tr>" + COLS.map(c => "<th>" + c[0] + "</th>").join("") + "</tr>" +
    dados.map(d => '<tr' + (d.conferir ? ' class="warn"' : "") + ">" + COLS.map(([, k]) =>
      NUMS.includes(k) ? '<td class="n">' + (typeof d[k] === "number" ? brl(d[k]) : "") + "</td>" : "<td>" + esc(d[k]) + "</td>").join("") + "</tr>").join("");
}

function exportar() {
  const aoa = [COLS.map(c => c[0]), ...dados.map(d => COLS.map(([, k]) => d[k] ?? ""))];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"] = COLS.map(c => ({ wch: c[2] }));
  ws["!autofilter"] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: aoa.length - 1, c: COLS.length - 1 } }) };
  for (const addr in ws) if (addr[0] !== "!" && ws[addr].t === "n") ws[addr].z = "#,##0.00";
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Informes");
  XLSX.writeFile(wb, "informes_" + new Date().toISOString().slice(0, 10) + ".xlsx");
}
</script>
</body>
</html>
